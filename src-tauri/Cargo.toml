[package]
name = "neon-strike"
version = "1.0.0"
description = "霓虹突袭 — 3D 第一人称射击"
authors = ["Neon Strike"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
